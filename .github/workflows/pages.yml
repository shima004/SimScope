name: Deploy to GitHub Pages

on:
  release:
    types: [published, edited, released]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - name: Check deployment target
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT_NAME" != "release" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          if [ "$RELEASE_TAG" != "$latest_tag" ]; then
            echo "Release ${RELEASE_TAG} is not latest (${latest_tag}); skipping."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        if: steps.gate.outputs.deploy == 'true'

      - uses: actions/setup-node@v6
        if: steps.gate.outputs.deploy == 'true'
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts
        if: steps.gate.outputs.deploy == 'true'

      - run: npm run build
        if: steps.gate.outputs.deploy == 'true'
        env:
          GITHUB_PAGES: true
          PUBLIC_DIRECT_FETCH: true

      - uses: actions/upload-pages-artifact@v4
        if: steps.gate.outputs.deploy == 'true'
        with:
          path: build

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
